<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Alarm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f12;
    --bg2: #13161b;
    --bg3: #1a1e25;
    --border: rgba(255,255,255,0.07);
    --border-hi: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #6ee7b7;
    --accent-dim: rgba(110,231,183,0.12);
    --accent-glow: rgba(110,231,183,0.25);
    --danger: #f87171;
    --danger-dim: rgba(248,113,113,0.1);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  .header {
    width: 100%; max-width: 620px;
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 2.5rem;
  }
  .logo { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .logo span { color: var(--accent); }
  .clock-display { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: 0.05em; }

  .hero { width: 100%; max-width: 620px; text-align: center; margin-bottom: 2rem; }
  .hero-time {
    font-family: var(--mono); font-size: clamp(52px, 10vw, 80px);
    font-weight: 300; letter-spacing: -0.02em; color: var(--text); line-height: 1; transition: color 0.3s;
  }
  .hero-time.active { color: var(--accent); }
  .session-info {
    font-size: 12px; color: var(--muted); margin-top: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; min-height: 18px;
  }
  .session-info .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; vertical-align: middle;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.4;transform:scale(0.8);} }

  .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 2.5rem; }
  .btn {
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    padding: 10px 24px; border-radius: 8px; border: 1px solid var(--border-hi);
    background: var(--bg2); color: var(--text); cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s; letter-spacing: 0.01em;
  }
  .btn:hover { background: var(--bg3); border-color: rgba(255,255,255,0.2); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent-glow); color: var(--accent); }
  .btn.primary:hover { background: rgba(110,231,183,0.18); }
  .btn.danger { background: var(--danger-dim); border-color: rgba(248,113,113,0.3); color: var(--danger); }
  .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .panel-row { width: 100%; max-width: 620px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; transition: border-color 0.2s; }
  .panel:hover { border-color: var(--border-hi); }
  .panel-label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

  .vol-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .vol-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  input[type=range] { flex: 1; -webkit-appearance: none; height: 3px; background: var(--bg3); border-radius: 2px; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; transition: transform 0.1s; }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .vol-val { font-family: var(--mono); font-size: 12px; color: var(--text); min-width: 28px; text-align: right; }

  .timers-section { width: 100%; max-width: 620px; margin-bottom: 12px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  .timer-item {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.9rem 1.1rem; margin-bottom: 8px; transition: border-color 0.2s; position: relative; overflow: hidden;
  }
  .timer-item:hover { border-color: var(--border-hi); }
  .timer-item.inactive { opacity: 0.45; }

  .timer-top { display: flex; align-items: center; justify-content: space-between; }
  .timer-left { display: flex; align-items: center; gap: 12px; }
  .timer-interval { font-family: var(--mono); font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: -0.01em; line-height: 1; }
  .timer-meta { display: flex; flex-direction: column; gap: 2px; }
  .timer-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .timer-sound-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .timer-sound-label { font-size: 11px; color: var(--muted); }
  .timer-sound-label.loaded { color: var(--accent); }
  .timer-count { font-size: 11px; color: var(--muted); }

  .timer-right { display: flex; align-items: center; gap: 8px; }
  .countdown { font-family: var(--mono); font-size: 13px; color: var(--accent); min-width: 40px; text-align: right; }

  .icon-btn {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border-hi); }
  .icon-btn.del:hover { background: var(--danger-dim); color: var(--danger); border-color: rgba(248,113,113,0.3); }
  .icon-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .sound-upload-inline {
    font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 5px;
    border: 1px solid var(--border-hi); background: var(--bg3); color: var(--muted);
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .sound-upload-inline:hover { background: rgba(255,255,255,0.07); color: var(--text); }
  .sound-upload-inline svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .timer-bar { height: 2px; background: var(--bg3); border-radius: 1px; margin-top: 10px; overflow: hidden; }
  .timer-bar-fill { height: 100%; background: var(--accent); border-radius: 1px; transition: width 0.8s linear; opacity: 0.7; }

  .add-form {
    background: var(--bg2); border: 1px solid var(--border-hi);
    border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 8px; display: none;
  }
  .add-form.visible { display: block; }
  .form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; }
  .form-group input[type=number],
  .form-group input[type=text] {
    font-family: var(--mono); font-size: 14px; background: var(--bg3);
    border: 1px solid var(--border-hi); border-radius: 7px; color: var(--text);
    padding: 8px 10px; outline: none; transition: border-color 0.15s; width: 70px;
  }
  .form-group input[type=text] { width: 150px; font-family: var(--sans); }
  .form-group input:focus { border-color: var(--accent); }

  .notif-area { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .notif {
    background: var(--accent-dim); border: 1px solid var(--accent-glow);
    border-radius: 9px; padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    animation: slideIn 0.2s ease-out;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);} }
  .notif-text { font-size: 13px; color: var(--accent); font-weight: 500; }
  .notif-time { font-family: var(--mono); font-size: 11px; color: var(--accent); opacity: 0.6; }
  .empty { text-align: center; padding: 2rem 0 1rem; color: var(--muted); font-size: 13px; }

  @media (max-width: 500px) { .panel-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="header">
  <div class="logo"><span>■</span> Game Alarm</div>
  <div class="clock-display" id="headerClock">00:00:00</div>
</header>

<div class="hero">
  <div class="hero-time" id="heroTime">00:00</div>
  <div class="session-info" id="sessionInfo">Press start to begin a session</div>
</div>

<div class="controls">
  <button class="btn primary" id="startBtn" onclick="startSession()">
    <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Start session
  </button>
  <button class="btn danger" id="stopBtn" onclick="stopSession()" style="display:none;">
    <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    Stop
  </button>
</div>

<div class="panel-row">
  <div class="panel">
    <div class="panel-label">Default sound</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5;">Used by timers that don't have their own sound.</p>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--border-hi);border-radius:7px;padding:7px 12px;font-size:12px;font-weight:500;background:var(--bg3);width:fit-content;">
      <svg style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload default sound
      <input type="file" id="defaultSoundFile" accept="audio/*" onchange="loadDefaultSound(this)" style="display:none;">
    </label>
    <div id="defaultSoundName" style="font-size:12px;color:var(--muted);margin-top:8px;">None — using built-in beep</div>
    <div class="vol-row">
      <label for="volSlider">Volume</label>
      <input type="range" id="volSlider" min="0" max="100" value="80" step="1" oninput="updateVol(this.value)">
      <span class="vol-val" id="volVal">80%</span>
    </div>
    <button class="btn" onclick="testDefaultSound()" style="margin-top:12px;font-size:12px;padding:7px 14px;">
      <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      Test sound
    </button>
  </div>

  <div class="panel">
    <div class="panel-label">This session</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:0.06em;text-transform:uppercase;">Duration</div>
        <div style="font-family:var(--mono);font-size:22px;font-weight:400;color:var(--text);" id="statDuration">0:00</div>
      </div>
      <div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:0.06em;text-transform:uppercase;">Total rings</div>
        <div style="font-family:var(--mono);font-size:22px;font-weight:400;color:var(--accent);" id="statCount">0</div>
      </div>
    </div>
  </div>
</div>

<div class="timers-section">
  <div class="section-header">
    <span class="section-title">Interval timers</span>
    <button class="btn" onclick="toggleAddForm()" style="font-size:12px;padding:6px 14px;">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add timer
    </button>
  </div>

  <div class="add-form" id="addForm">
    <div class="form-row">
      <div class="form-group">
        <label>Minutes</label>
        <input type="number" id="newMin" min="0" max="99" value="2" placeholder="0">
      </div>
      <div style="align-self:flex-end;padding-bottom:9px;color:var(--muted);font-size:14px;">:</div>
      <div class="form-group">
        <label>Seconds</label>
        <input type="number" id="newSec" min="0" max="59" value="0" placeholder="0">
      </div>
      <div class="form-group">
        <label>Label</label>
        <input type="text" id="newLabel" placeholder="e.g. Buy item">
      </div>
      <button class="btn primary" onclick="addTimer()" style="font-size:13px;">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Save
      </button>
      <button class="btn" onclick="toggleAddForm()" style="font-size:13px;padding:9px 12px;">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div id="timerList"></div>
</div>

<div class="notif-area" id="notifArea"></div>

<script>
let timers = [
  {id:1,label:'2 minutes',interval:120,remaining:120,active:true,count:0,audioBuffer:null,soundName:''},
  {id:2,label:'3 minutes',interval:180,remaining:180,active:true,count:0,audioBuffer:null,soundName:''},
];
let nextId = 3;
let sessionRunning = false;
let sessionSeconds = 0;
let totalCount = 0;
let defaultAudioBuffer = null;
let audioCtx = null;
let volume = 0.8;
let tickInterval = null;

function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function decodeInto(arrayBuffer, onSuccess, onFail){
  getCtx().decodeAudioData(arrayBuffer, onSuccess, onFail);
}

function loadDefaultSound(input){
  const file = input.files[0];
  if(!file) return;
  const nm = document.getElementById('defaultSoundName');
  nm.textContent = file.name.length > 28 ? file.name.substring(0,26)+'…' : file.name;
  nm.style.color = 'var(--accent)';
  const reader = new FileReader();
  reader.onload = e => {
    decodeInto(e.target.result, buf => { defaultAudioBuffer = buf; }, () => {
      nm.textContent='Unsupported format'; nm.style.color='var(--danger)';
    });
  };
  reader.readAsArrayBuffer(file);
}

function loadTimerSound(id, input){
  const file = input.files[0];
  if(!file) return;
  const t = timers.find(x=>x.id===id);
  if(!t) return;
  const shortName = file.name.length > 20 ? file.name.substring(0,18)+'…' : file.name;
  const reader = new FileReader();
  reader.onload = e => {
    decodeInto(e.target.result, buf => {
      t.audioBuffer = buf;
      t.soundName = shortName;
      renderTimers();
    }, () => {
      alert('Unsupported audio format');
    });
  };
  reader.readAsArrayBuffer(file);
}

function clearTimerSound(id){
  const t = timers.find(x=>x.id===id);
  if(!t) return;
  t.audioBuffer = null;
  t.soundName = '';
  renderTimers();
}

function playBuffer(buf){
  const ctx = getCtx();
  const src = ctx.createBufferSource();
  const gain = ctx.createGain();
  src.buffer = buf;
  gain.gain.value = volume;
  src.connect(gain);
  gain.connect(ctx.destination);
  src.start(0);
}

function playBeep(){
  const ctx = getCtx();
  [880,660,880].forEach((freq,i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type='sine'; osc.frequency.value=freq;
    const t = ctx.currentTime + i*0.18;
    gain.gain.setValueAtTime(volume*0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.14);
    osc.start(t); osc.stop(t+0.15);
  });
}

function playSoundForTimer(t){
  if(t.audioBuffer) playBuffer(t.audioBuffer);
  else if(defaultAudioBuffer) playBuffer(defaultAudioBuffer);
  else playBeep();
}

function testDefaultSound(){
  if(defaultAudioBuffer) playBuffer(defaultAudioBuffer);
  else playBeep();
}

function updateVol(v){ volume=v/100; document.getElementById('volVal').textContent=v+'%'; }

function pad(n){ return String(Math.round(n)).padStart(2,'0'); }
function fmtTime(s){ s=Math.round(s); return pad(Math.floor(s/60))+':'+pad(s%60); }
function fmtLong(s){ s=Math.round(s); if(s<3600) return pad(Math.floor(s/60))+':'+pad(s%60); return Math.floor(s/3600)+':'+pad(Math.floor((s%3600)/60))+':'+pad(s%60); }

function updateClock(){
  const now = new Date();
  document.getElementById('headerClock').textContent = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  if(!sessionRunning) document.getElementById('heroTime').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
}

function startSession(){
  if(sessionRunning) return;
  sessionRunning = true; sessionSeconds = 0; totalCount = 0;
  timers.forEach(t=>{ if(t.active){t.remaining=t.interval; t.count=0;} });
  document.getElementById('startBtn').style.display='none';
  document.getElementById('stopBtn').style.display='flex';
  document.getElementById('heroTime').classList.add('active');
  document.getElementById('statCount').textContent='0';
  tickInterval = setInterval(tick, 1000);
  renderTimers();
}

function stopSession(){
  sessionRunning = false; clearInterval(tickInterval);
  document.getElementById('startBtn').style.display='flex';
  document.getElementById('stopBtn').style.display='none';
  document.getElementById('heroTime').classList.remove('active');
  document.getElementById('sessionInfo').innerHTML='Session ended &mdash; '+fmtLong(sessionSeconds);
  renderTimers();
}

function tick(){
  sessionSeconds++;
  document.getElementById('heroTime').textContent = fmtLong(sessionSeconds);
  document.getElementById('statDuration').textContent = fmtLong(sessionSeconds);
  document.getElementById('sessionInfo').innerHTML = '<span class="dot"></span>Session running';
  timers.forEach(t=>{
    if(!t.active) return;
    t.remaining--;
    if(t.remaining<=0){
      t.remaining=t.interval; t.count++; totalCount++;
      document.getElementById('statCount').textContent=totalCount;
      fireNotif(t);
      playSoundForTimer(t);
    }
  });
  renderTimers();
}

function fireNotif(t){
  const area = document.getElementById('notifArea');
  const el = document.createElement('div');
  el.className='notif';
  el.innerHTML=`<span class="notif-text">&#9654; ${t.label}</span><span class="notif-time">${fmtLong(sessionSeconds)}</span>`;
  area.insertBefore(el, area.firstChild);
  while(area.children.length>4) area.removeChild(area.lastChild);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.4s'; setTimeout(()=>el.remove(),400); }, 3500);
}

function renderTimers(){
  const list = document.getElementById('timerList');
  if(!timers.length){
    list.innerHTML='<div class="empty">No timers yet &mdash; add one above</div>';
    return;
  }
  list.innerHTML = timers.map(t=>{
    const pct = sessionRunning && t.active ? Math.round(((t.interval-t.remaining)/t.interval)*100) : 0;
    const cd = sessionRunning && t.active ? '-'+fmtTime(t.remaining) : '';
    const soundBadge = t.soundName
      ? `<span class="timer-sound-label loaded">&#9834; ${t.soundName}</span>
         <button onclick="clearTimerSound(${t.id})" title="Remove sound" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;padding:0;line-height:1;">&#x2715;</button>`
      : `<span class="timer-sound-label">Using default sound</span>`;
    return `<div class="timer-item${!t.active?' inactive':''}">
      <div class="timer-top">
        <div class="timer-left">
          <div class="timer-interval">${fmtTime(t.interval)}</div>
          <div class="timer-meta">
            <div class="timer-name">${t.label}</div>
            <div class="timer-sound-row">
              ${soundBadge}
            </div>
            <div class="timer-count">Rang ${t.count}x this session</div>
          </div>
        </div>
        <div class="timer-right">
          ${cd ? `<div class="countdown">${cd}</div>` : ''}
          <label class="sound-upload-inline" title="Upload sound for this timer">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Sound
            <input type="file" accept="audio/*" onchange="loadTimerSound(${t.id}, this)" style="display:none;">
          </label>
          <button class="icon-btn" onclick="toggleTimer(${t.id})" title="${t.active?'Disable':'Enable'}">
            ${t.active
              ? `<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`
              : `<svg viewBox="0 0 24 24"><path d="M8.56 2.9A7 7 0 0 1 19 9v4m-2 4H3s3-2 3-9a4 4 0 0 1 .25-1.4M10.17 6A3 3 0 0 1 13 9v1"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            }
          </button>
          <button class="icon-btn del" onclick="removeTimer(${t.id})" title="Delete">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
      <div class="timer-bar"><div class="timer-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function toggleTimer(id){
  const t=timers.find(x=>x.id===id);
  if(t){t.active=!t.active; if(t.active)t.remaining=t.interval; renderTimers();}
}
function removeTimer(id){ timers=timers.filter(x=>x.id!==id); renderTimers(); }

function toggleAddForm(){
  document.getElementById('addForm').classList.toggle('visible');
}

function addTimer(){
  const min=parseInt(document.getElementById('newMin').value)||0;
  const sec=parseInt(document.getElementById('newSec').value)||0;
  const lbl=document.getElementById('newLabel').value.trim()||(min>0?min+' min':'')+(sec>0?(min>0?' ':'')+sec+' sec':'');
  const total=min*60+sec;
  if(total<1){alert('Minimum interval is 1 second'); return;}
  timers.push({id:nextId++,label:lbl||total+'s',interval:total,remaining:total,active:true,count:0,audioBuffer:null,soundName:''});
  document.getElementById('newMin').value='';
  document.getElementById('newSec').value='';
  document.getElementById('newLabel').value='';
  document.getElementById('addForm').classList.remove('visible');
  renderTimers();
}

setInterval(updateClock, 1000);
updateClock();
renderTimers();
</script>
</body>
</html>
